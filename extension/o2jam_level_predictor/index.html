<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O2Jam 7K Level Predictor Overlay</title>
  <link rel="stylesheet" href="style.css">
  <!-- ONNX Runtime Web: Local offline bundle with CDN fallback -->
  <script src="./ort.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js';"></script>
</head>
<body>
  <div id="overlay-container">
    <div class="level-row">
      <span class="level-label">Level.</span>
      <span class="level-num" id="level-display">--</span>
      <span class="rate-badge" id="rate-badge" hidden></span>
    </div>
    <div class="status-row">
      <span class="status-dot idle" id="status-dot"></span>
      <span id="status-text">Connecting to Tosu...</span>
    </div>
  </div>

  <script type="module" src="index.js"></script>
</body>
</html>
